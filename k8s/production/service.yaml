apiVersion: v1
kind: Service
metadata:
  name: microservice-app
  namespace: production
  labels:
    app: microservice-app
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"
spec:
  type: LoadBalancer
  selector:
    app: microservice-app
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: microservice-app-internal
  namespace: production
  labels:
    app: microservice-app
spec:
  type: ClusterIP
  selector:
    app: microservice-app
  ports:
  - name: http
    port: 3000
    targetPort: http
    protocol: TCP
