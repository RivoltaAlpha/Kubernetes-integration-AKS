apiVersion: v1
kind: ConfigMap
metadata:
  name: microservice-app-config
  namespace: production
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
  # Application Insights configuration
  APPLICATIONINSIGHTS_CONFIGURATION_CONTENT: |
    {
      "role": {
        "name": "microservice-app"
      },
      "sampling": {
        "percentage": 100
      }
    }
